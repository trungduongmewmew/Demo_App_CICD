apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo-app
  template:
    metadata:
      labels:
        app: demo-app
    spec:
      containers:
      - name: demo-app-container
        
        image: duongdt1998/demo-app-cicd:latest 
        ports:
        - containerPort: 8080
        
        
        env:
        
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: postgres-creds  
              key: DB_USER          
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-creds
              key: DB_PASSWORD
              
        
        - name: DB_HOST
          value: "192.168.4.67"  
        - name: DB_NAME
          value: "postgres"       
        - name: DB_PORT
          value: "5432"
        